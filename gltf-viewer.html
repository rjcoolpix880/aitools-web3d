<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLTF File Viewer - Debug Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            min-width: 300px;
        }
        
        #controls h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #ccc;
        }
        
        select, input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 12px;
        }
        
        select:focus, input[type="file"]:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        #info {
            margin-top: 10px;
            font-size: 11px;
            color: #888;
            line-height: 1.4;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 50;
        }
        
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-size: 14px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            display: none;
        }
        
        #error.visible {
            display: block;
        }
        
        .instructions {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h2>GLTF Viewer</h2>
        
        <div class="control-group">
            <label for="fileSelect">Select GLTF File:</label>
            <select id="fileSelect">
                <option value="">-- Select a file --</option>
                <option value="BaseSurface.gltf">BaseSurface.gltf</option>
                <option value="PanelUnitsColored.gltf">PanelUnitsColored.gltf</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="fileInput">Or Load Custom File:</label>
            <input type="file" id="fileInput" accept=".gltf,.glb">
        </div>
        
        <div class="control-group" id="outlineControls" style="display: none;">
            <h3 style="font-size: 14px; margin: 15px 0 10px 0; color: #4CAF50;">Edge Outlines</h3>
            <label>
                <input type="checkbox" id="outlineEnabled" style="width: auto; margin-right: 5px;">
                Enable Outlines
            </label>
            <label for="outlineColor" style="margin-top: 8px;">Color:</label>
            <input type="color" id="outlineColor" value="#000000" style="width: 100%; padding: 4px; margin-bottom: 8px;">
            <label for="outlineWidth">Line Weight:</label>
            <input type="range" id="outlineWidth" min="0.5" max="5" step="0.1" value="1" style="width: 100%;">
            <span id="outlineWidthValue" style="font-size: 11px; color: #888;">1.0</span>
        </div>
        
        <div id="info">
            <div><strong>Controls:</strong></div>
            <div>• Left Click + Drag: Rotate</div>
            <div>• Right Click + Drag: Pan</div>
            <div>• Scroll: Zoom</div>
            <div>• Middle Click + Drag: Pan</div>
        </div>
        
        <div class="instructions">
            <div><strong>Current File:</strong> <span id="currentFile">None</span></div>
            <div id="fileInfo"></div>
        </div>
    </div>
    
    <div id="canvas-container"></div>
    <div id="loading" style="display: none;">Loading model...</div>
    <div id="error"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { setupLighting, setupRenderer, configureModelForRendering } from './lighting-config.js';
        import { EdgeOutlineManager } from './edge-outline.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // White background
        
        // Camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(5, 5, 5);
        
        // Renderer - use centralized setup
        const renderer = setupRenderer(document.getElementById('canvas-container'));
        
        // Controls for spinning and zooming
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 1;
        controls.maxDistance = 100;
        
        // Lighting - use centralized setup (ambient + directional)
        setupLighting(scene);
        
        // Grid helper (will be updated when model loads)
        let gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        // Axes helper
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);
        
        // Loader
        const loader = new GLTFLoader();
        
        // Optional: DRACO loader for compressed models
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
        loader.setDRACOLoader(dracoLoader);
        
        let currentModel = null;
        let boundingBox = null;
        const outlineManager = new EdgeOutlineManager();
        let currentOutlineSettings = {
            enabled: false,
            color: 0x000000,
            lineWidth: 1,
            thresholdAngle: 15
        };
        
        // Function to load and display model
        function loadModel(filePath) {
            // Remove previous model and its outlines
            if (currentModel) {
                outlineManager.removeOutlines(currentModel);
                scene.remove(currentModel);
                currentModel = null;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').classList.remove('visible');
            document.getElementById('fileInfo').textContent = '';
            
            loader.load(
                filePath,
                (gltf) => {
                    currentModel = gltf.scene;
                    
                    // Configure model for rendering (shadows, double-sided materials)
                    configureModelForRendering(currentModel);
                    
                    // Debug: Check materials and ensure they're visible
                    let meshCount = 0;
                    currentModel.traverse((child) => {
                        if (child.isMesh) {
                            meshCount++;
                            if (child.material) {
                                const materials = Array.isArray(child.material) ? child.material : [child.material];
                                materials.forEach((material, idx) => {
                                    console.log(`Mesh ${meshCount}, Material ${idx}:`, {
                                        type: material.type,
                                        color: material.color ? material.color.getHexString() : 'no color',
                                        emissive: material.emissive ? material.emissive.getHexString() : 'no emissive',
                                        side: material.side
                                    });
                                    
                                    // Material configuration is handled by configureModelForRendering
                                    material.needsUpdate = true;
                                });
                            }
                        }
                    });
                    
                    scene.add(currentModel);
                    
                    // Show outline controls
                    document.getElementById('outlineControls').style.display = 'block';
                    
                    // Apply current outline settings if enabled
                    if (currentOutlineSettings.enabled) {
                        outlineManager.addOutlines(currentModel, currentOutlineSettings);
                    }
                    
                    // Calculate bounding box and center camera - improved zoom to extents
                    boundingBox = new THREE.Box3().setFromObject(currentModel);
                    const center = boundingBox.getCenter(new THREE.Vector3());
                    const size = boundingBox.getSize(new THREE.Vector3());
                    
                    console.log('Model bounds:', {
                        center: center,
                        size: size,
                        min: boundingBox.min,
                        max: boundingBox.max
                    });
                    
                    // Better zoom to extents calculation
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let distance = maxDim / (2 * Math.tan(fov / 2));
                    distance *= 1.2; // Add padding
                    
                    // Position camera to view the entire model
                    camera.position.set(
                        center.x + distance * 0.6,
                        center.y + distance * 0.6,
                        center.z + distance * 0.6
                    );
                    controls.target.copy(center);
                    controls.update();
                    
                    // Update grid to match model scale
                    scene.remove(gridHelper);
                    const gridSize = Math.max(maxDim * 2, 50);
                    const newGridHelper = new THREE.GridHelper(gridSize, Math.ceil(gridSize / 10), 0x444444, 0x222222);
                    scene.add(newGridHelper);
                    
                    // Update info
                    document.getElementById('fileInfo').innerHTML = `
                        <div>Bounds: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}</div>
                        <div>Center: (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})</div>
                        <div>Meshes: ${gltf.scene.children.length}</div>
                    `;
                    
                    document.getElementById('loading').style.display = 'none';
                    console.log('Model loaded:', filePath);
                },
                (progress) => {
                    if (progress.lengthComputable) {
                        const percent = (progress.loaded / progress.total) * 100;
                        console.log('Loading:', percent.toFixed(2) + '%');
                    }
                },
                (error) => {
                    console.error('Error loading model:', error);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').textContent = `Error loading model: ${error.message || error}`;
                    document.getElementById('error').classList.add('visible');
                }
            );
        }
        
        // File select dropdown
        document.getElementById('fileSelect').addEventListener('change', (e) => {
            const file = e.target.value;
            if (file) {
                document.getElementById('currentFile').textContent = file;
                document.getElementById('fileInput').value = '';
                loadModel(file);
            }
        });
        
        // File input
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('currentFile').textContent = file.name;
                document.getElementById('fileSelect').value = '';
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const blob = new Blob([event.target.result], { type: 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    loadModel(url);
                };
                reader.readAsArrayBuffer(file);
            }
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Outline control handlers
        document.getElementById('outlineEnabled').addEventListener('change', (e) => {
            currentOutlineSettings.enabled = e.target.checked;
            if (currentModel) {
                if (currentOutlineSettings.enabled) {
                    outlineManager.addOutlines(currentModel, currentOutlineSettings);
                } else {
                    outlineManager.removeOutlines(currentModel);
                }
            }
        });
        
        document.getElementById('outlineColor').addEventListener('input', (e) => {
            const color = e.target.value;
            currentOutlineSettings.color = parseInt(color.replace('#', ''), 16);
            if (currentModel && currentOutlineSettings.enabled) {
                outlineManager.setOutlineColor(currentModel, currentOutlineSettings.color);
            }
        });
        
        document.getElementById('outlineWidth').addEventListener('input', (e) => {
            const width = parseFloat(e.target.value);
            currentOutlineSettings.lineWidth = width;
            document.getElementById('outlineWidthValue').textContent = width.toFixed(1);
            if (currentModel && currentOutlineSettings.enabled) {
                outlineManager.updateOutlines(currentModel, currentOutlineSettings);
            }
        });
        
        // Auto-load first GLTF file on startup
        const firstFile = document.getElementById('fileSelect').options[1]?.value;
        if (firstFile) {
            document.getElementById('fileSelect').value = firstFile;
            document.getElementById('currentFile').textContent = firstFile;
            loadModel(firstFile);
        }
        
        // Start animation
        animate();
    </script>
</body>
</html>
