            // Set depthWrite based on opacity - false when fading or invisible

                if (child.isMesh) {
                    // Disable shadow casting when transparent

                    if (child.material) {

                console.log('SubpanelsOutlinePipe loaded (starts invisible)');
                checkModelsLoaded();
            },
            undefined,
            (error) => console.error('Error loading SubpanelsOutlinePipe:', error)
        );
        
        // Load PanelInfillUntrimmed
        loader.load(
            './Panel-Infill-Untrimmed.glb',
            (gltf) => {
                panelInfillUntrimmed = gltf.scene;
                panelInfillUntrimmed.position.set(0, 0, 0);
                configureModelForRendering(panelInfillUntrimmed);
                panelInfillUntrimmed.traverse((child) => {
                    if (child.isMesh && child.material) {
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        materials.forEach((material, index) => {
                            const key = Array.isArray(child.material) ? `${child.uuid}-${index}` : child.uuid;
                            panelInfillUntrimmedOriginalOpacity[key] = material.opacity !== undefined ? material.opacity : 1.0;
                            material.transparent = true;
                            material.opacity = 0.0;
                        });
                    }
                });
                updatePanelInfillUntrimmedOpacity(0);
                scene.add(panelInfillUntrimmed);
                console.log('PanelInfillUntrimmed loaded');
                checkModelsLoaded();
            },
            undefined,
            (error) => console.error('Error loading PanelInfillUntrimmed:', error)
        );
        
        // Load PanelInfillTrimmed
        loader.load(
            './Panel-Infill-Trimmed.glb',
            (gltf) => {
                panelInfillTrimmed = gltf.scene;
                panelInfillTrimmed.position.set(0, 0, 0);
                configureModelForRendering(panelInfillTrimmed);
                panelInfillTrimmed.traverse((child) => {
                    if (child.isMesh && child.material) {
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        materials.forEach((material, index) => {
                            const key = Array.isArray(child.material) ? `${child.uuid}-${index}` : child.uuid;
                            panelInfillTrimmedOriginalOpacity[key] = material.opacity !== undefined ? material.opacity : 1.0;
                            material.transparent = true;
                            material.opacity = 0.0;
                        });
                    }
                });
                updatePanelInfillTrimmedOpacity(0);
                scene.add(panelInfillTrimmed);
                console.log('PanelInfillTrimmed loaded');
                checkModelsLoaded();
            },
            undefined,
            (error) => console.error('Error loading PanelInfillTrimmed:', error)
        );
        
        // Load PanelInfill
        loader.load(
            './Panels-Infill.glb',
            (gltf) => {
                panelInfill = gltf.scene;
                panelInfill.position.set(0, 0, 0);
                // Configure model for rendering - preserve colors from GLTF file
                configureModelForRendering(panelInfill, true); // true = preserve colors
                panelInfill.traverse((child) => {
                    if (child.isMesh && child.material) {
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        materials.forEach((material, index) => {
                            const key = Array.isArray(child.material) ? `${child.uuid}-${index}` : child.uuid;
                            panelInfillOriginalOpacity[key] = material.opacity !== undefined ? material.opacity : 1.0;
                            material.transparent = true;
                            material.opacity = 0.0;
                        });
                    }
                });
                updatePanelInfillOpacity(0);
                scene.add(panelInfill);
                console.log('PanelInfill loaded');
                checkModelsLoaded();
            },
            undefined,
            (error) => console.error('Error loading PanelInfill:', error)
        );
        
        // Check if all required models are loaded (attractorPipe is optional)
        function checkModelsLoaded() {
            // Required models
            const requiredModels = [
                baseSurface, panelUnits, wallOutlineExtruded, glazing,
                cylinderStraight, cylinder, circlePipes, baseSurfaceUntrimmedMiddle,
                baseSurfaceUntrimmedSides, panelUnitPipe, subpanels, subpanelsColored, 
                subpanelsOutlinePipe, simpleBuilding, panelInfillUntrimmed, 
                panelInfillTrimmed, panelInfill
            ];
            
            const allRequiredLoaded = requiredModels.every(model => model !== null);
            
            if (allRequiredLoaded) {
                document.getElementById('loading').style.display = 'none';
                
                // Log scene info for debugging
                console.log('All required models loaded. Scene children:', scene.children.length);
                if (!attractorPipe) console.warn('attractorPipe.glb is missing');
                
                // Start GSAP animations
                startAnimations();
            }
        }
        
        // Calculate what needs to fade in/out between two steps
        function calculateStepTransition(prevStep, nextStep) {
            // Extract models array from step objects (handle both old array format and new object format)
            const prevModels = Array.isArray(prevStep) ? prevStep : (prevStep?.models || []);
            const nextModels = Array.isArray(nextStep) ? nextStep : (nextStep?.models || []);
            
            const prevSet = new Set(prevModels);
            const nextSet = new Set(nextModels);
            
            const fadeIn = nextModels.filter(item => !prevSet.has(item));
            const fadeOut = prevModels.filter(item => !nextSet.has(item));
            
            return { fadeIn, fadeOut };
        }
        
        // Update text overlay for a specific step
        function updateStepText(stepIndex) {
            const textOverlay = document.getElementById('text-overlay');
            if (!textOverlay) return;
            
            const step = animationConfig.steps[stepIndex];
            if (step && step.text !== undefined) {
                textOverlay.textContent = step.text;
            } else {
                textOverlay.textContent = '';
            }
        }
        
        // Set visibility for all models based on step configuration
        function setStepVisibility(stepIndex) {
            const step = animationConfig.steps[stepIndex];
            if (!step || !step.models) return;
            
            // Get all model names
            const allModelNames = Object.keys(modelMap);
            
            // Set opacity for each model
            allModelNames.forEach(modelName => {
                const shouldBeVisible = step.models.includes(modelName);
                const opacity = shouldBeVisible ? 1 : 0;
                const modelInfo = modelMap[modelName];
                if (modelInfo && modelInfo.update) {
                    modelInfo.update(opacity);
                }
            });
            
            // Update step text
            updateStepText(stepIndex);
        }
        
        // Start all animations with GSAP
        function startAnimations() {
            console.log('[Animation] Starting step-based animations');
            console.log('[Animation] Config:', animationConfig);
            
            // Create main timeline that loops
            mainTimeline = gsap.timeline({ repeat: -1 });
            
            // Set initial state - first step
            setStepVisibility(0);
            
            // Also set in timeline at time 0 to ensure it happens at the start of each loop
            mainTimeline.set({}, {
                onStart: function() {
                    setStepVisibility(0);
                }
            }, 0);
            
            // Build timeline by processing each step transition
            // Step 0 starts at time 0 and is visible for stepTiming seconds
            // Transition to step i (i > 0) happens at: i * stepTiming + (i - 1) * fadeTiming
            
            for (let i = 1; i < animationConfig.steps.length; i++) {
                const prevStep = animationConfig.steps[i - 1];
                const nextStep = animationConfig.steps[i];
                const transition = calculateStepTransition(prevStep, nextStep);
                
                // Calculate when this transition starts
                const transitionStartTime = i * animationConfig.stepTiming + (i - 1) * animationConfig.fadeTiming;
                
                // Update text at the start of transition
                mainTimeline.call(() => {
                    updateStepText(i);
                }, [], transitionStartTime);
                
                // Fade out items that are leaving
                transition.fadeOut.forEach(modelName => {
                    const modelInfo = modelMap[modelName];
                    if (modelInfo && modelInfo.update) {
                        const fadeOut = { progress: 1 };
                        mainTimeline.to(fadeOut, {
                            progress: 0,
                            duration: animationConfig.fadeTiming,
                            ease: "power2.in",
                            onUpdate: function() {
                                modelInfo.update(fadeOut.progress);
                            }
                        }, transitionStartTime);
                    }
                });
                
                // Fade in items that are appearing
                transition.fadeIn.forEach(modelName => {
                    const modelInfo = modelMap[modelName];
                    if (modelInfo && modelInfo.update) {
                        const fadeIn = { progress: 0 };
                        mainTimeline.to(fadeIn, {
                            progress: 1,
                            duration: animationConfig.fadeTiming,
                            ease: "power2.out",
                            onUpdate: function() {
                                modelInfo.update(fadeIn.progress);
                            }
                        }, transitionStartTime);
                    }
                });
                
                // Items that stay visible don't need animation (they're already at opacity 1)
                // Items that stay invisible don't need animation (they're already at opacity 0)
            }
            
            console.log('[Animation] All step transitions added to timeline');
            
            // Initialize manual step control
            setupManualStepControl();
        }
        
        // Calculate which step we're in based on time
        function getStepFromTime(time) {
            let accumulatedTime = 0;
            for (let i = 0; i < animationConfig.steps.length; i++) {
                if (i > 0) {
                    accumulatedTime += animationConfig.stepTiming;
                }
                // Check if we're in the fade transition period
                if (time >= accumulatedTime && time < accumulatedTime + animationConfig.fadeTiming) {
                    // During fade transition - return previous step index
                    return i > 0 ? i - 1 : 0;
                }
                // Check if we're in the stable period of this step
                if (time >= accumulatedTime + animationConfig.fadeTiming && 
                    (i === animationConfig.steps.length - 1 || time < accumulatedTime + animationConfig.stepTiming)) {
                    return i;
                }
                accumulatedTime += animationConfig.fadeTiming;
            }
            // If past all steps, return last step
            return animationConfig.steps.length - 1;
        }
        
        // Update all opacities to match a specific step
        function updateOpacitiesToStep(stepIndex) {
            setStepVisibility(stepIndex);
        }
        
        // Manual step control - allows stepping through animation
        function setupManualStepControl() {
            let currentStepIndex = 0;
            let isManualMode = false;
            let wasPausedBeforeManual = false;
            
            // Mouse interaction tracking for click vs drag detection
            let mouseDownTime = 0;
            let mouseDownX = 0;
            let mouseDownY = 0;
            let hasMoved = false;
            const DRAG_THRESHOLD = 5; // pixels - if mouse moves more than this, it's a drag
            const LONG_CLICK_THRESHOLD = 200; // milliseconds - if held longer, it's a long click
            
            const canvas = renderer.domElement;
            
            // Calculate time for a step (when it's fully visible, after fade completes)
            function getTimeForStep(stepIndex) {
                if (stepIndex === 0) return 0;
                // Step i is fully visible after: i * stepTiming + (i - 1) * fadeTiming + fadeTiming
                // Which simplifies to: i * stepTiming + i * fadeTiming = i * (stepTiming + fadeTiming)
                return stepIndex * animationConfig.stepTiming + stepIndex * animationConfig.fadeTiming;
            }
            
            // Go to a specific step
            function goToStep(stepIndex) {
                if (stepIndex < 0 || stepIndex >= animationConfig.steps.length) {
                    return; // Out of bounds
                }
                
                currentStepIndex = stepIndex;
                const targetTime = getTimeForStep(stepIndex);
                
                // Pause timeline and seek to the step time
                if (mainTimeline) {
                    wasPausedBeforeManual = mainTimeline.paused();
                    mainTimeline.pause();
                    mainTimeline.time(targetTime);
                    isManualMode = true;
                }
                
                // Manually update all opacities to match the step
                updateOpacitiesToStep(stepIndex);
                
                const step = animationConfig.steps[stepIndex];
                const stepItems = step?.models ? step.models.join(', ') : '';
                console.log(`[Manual Step] Moved to step ${stepIndex + 1}: [${stepItems}]`);
            }
            
            // Go to next step
            function nextStep() {
                if (currentStepIndex < animationConfig.steps.length - 1) {
                    goToStep(currentStepIndex + 1);
                }
            }
            
            // Go to previous step
            function previousStep() {
                if (currentStepIndex > 0) {
                    goToStep(currentStepIndex - 1);
                }
            }
            
            // Resume automatic animation
            function resumeAutomatic() {
                if (mainTimeline && isManualMode) {
                    // Resume from current position if it was playing, or restart if it was paused
                    if (!wasPausedBeforeManual) {
                        mainTimeline.resume();
                    }
                    isManualMode = false;
                    console.log('[Manual Step] Resumed automatic animation');
                }
            }
            
            // Mouse down - track position and time
            canvas.addEventListener('mousedown', (e) => {
                // Only handle left mouse button for step control
                if (e.button === 0) {
                    mouseDownTime = Date.now();
                    mouseDownX = e.clientX;
                    mouseDownY = e.clientY;
                    hasMoved = false;
                }
            });
            
            // Mouse move - detect if user is dragging
            canvas.addEventListener('mousemove', (e) => {
                if (mouseDownTime > 0) {
                    const dx = Math.abs(e.clientX - mouseDownX);
                    const dy = Math.abs(e.clientY - mouseDownY);
                    if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) {
                        hasMoved = true;
                    }
                }
            });
            
            // Mouse up - determine if it was a click or drag
            canvas.addEventListener('mouseup', (e) => {
                if (e.button === 0 && mouseDownTime > 0) {
                    const clickDuration = Date.now() - mouseDownTime;
                    const isLongClick = clickDuration > LONG_CLICK_THRESHOLD;
                    
                    // If it's a short click without movement, advance to next step
                    if (!hasMoved && !isLongClick) {
                        e.preventDefault();
                        e.stopPropagation();
                        nextStep();
                    }
                    
                    // Reset tracking
                    mouseDownTime = 0;
                    hasMoved = false;
                }
            });
            
            // Right click - go to previous step
            canvas.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                previousStep();
                return false;
            });
            
            // Arrow keys for navigation, Spacebar to resume automatic mode
            window.addEventListener('keydown', (e) => {
                // Only handle if not typing in an input field
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    return;
                }
                
                switch (e.key) {
                    case 'ArrowRight':
                        e.preventDefault();
                        nextStep();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        previousStep();
                        break;
                    case ' ':
                        e.preventDefault();
                        if (isManualMode) {
                            resumeAutomatic();
                        }
                        break;
                }
            });
            
            // Double-click to resume automatic mode
            let lastClickTime = 0;
            const DOUBLE_CLICK_THRESHOLD = 300; // milliseconds
            canvas.addEventListener('click', (e) => {
                if (e.button === 0 && !hasMoved) {
                    const currentTime = Date.now();
                    if (currentTime - lastClickTime < DOUBLE_CLICK_THRESHOLD && isManualMode) {
                        e.preventDefault();
                        resumeAutomatic();
                    }
                    lastClickTime = currentTime;
                }
            });
            
            // If user clicks and drags (for orbit controls), don't interfere
            // OrbitControls will handle the drag, and our mousemove detection will prevent stepping
            
            console.log('[Manual Step] Step control initialized. Click to advance, right-click to go back, arrow keys to navigate.');
        }
        
        // Animation loop (simplified - GSAP handles animations)
        function animate() {
            requestAnimationFrame(animate);
            
            // Update controls for smooth camera movement
            controls.update();
            
            // Render with SSAO
            composer.render();
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start animation
        animate();
        
        // Text overlay function (for future use)
        window.showText = function(text, duration = 2000) {
            const overlay = document.getElementById('text-overlay');
            overlay.textContent = text;
            overlay.classList.add('visible');
            
            if (duration > 0) {
                setTimeout(() => {
                    overlay.classList.remove('visible');
                }, duration);
            }
        };
        
        // Hide text function
        window.hideText = function() {
            document.getElementById('text-overlay').classList.remove('visible');
        };
    </script>
</body>
